---
layout: default

---

<link rel="stylesheet" href="{{ "/assets/css/cinema.css" | absolute_url}}">

{% assign videos = site.data.videos %}

<main class="container">
  <div class="cinema-container">
    <div class="cinema-screen">
      <div class="carousel" id="cinema-carousel">
        {% for video in videos %}
         <div class="carousel-slide {% if forloop.first %}active{% endif %}">
            <iframe src="{{ video.url }}" allowfullscreen title="{{ video.title }}"></iframe>
          </div>
        {% endfor %}
      </div>
      
      <!-- Navigation Arrows -->
      <button class="carousel-arrow left" onclick="showSlide(current - 1)" aria-label="Previous video">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button class="carousel-arrow right" onclick="showSlide(current + 1)" aria-label="Next video">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
    <div class="carousel-thumbnails" id="carousel-thumbnails">
      {% for video in videos %}
        <img src="{{ video.thumbnail }}" class="{% if forloop.first %}active{% endif %}" alt="{{ video.title }}" onclick="showSlide({{ forloop.index0 }})">
      {% endfor %}
    </div>
  </div>
</main>

<script>
  const slides = document.querySelectorAll('.carousel-slide');
  const thumbs = document.querySelectorAll('#carousel-thumbnails img');
  let current = 0;
  
  function showSlide(idx) {
    // Stop previous video by resetting its src
    const prevIframe = slides[current].querySelector('iframe');
    const prevSrc = prevIframe.src;
    prevIframe.src = '';
    slides[current].classList.remove('active');
    thumbs[current].classList.remove('active');
    current = (idx + slides.length) % slides.length;
    slides[current].classList.add('active');
    thumbs[current].classList.add('active');
    // Restore src for new video (if it was blanked)
    const newIframe = slides[current].querySelector('iframe');
    if (!newIframe.src) newIframe.src = newIframe.getAttribute('data-orig-src') || prevSrc;
  }
  
  // Store original src for each iframe
  slides.forEach(slide => {
    const iframe = slide.querySelector('iframe');
    if (iframe) iframe.setAttribute('data-orig-src', iframe.src);
  });
  
  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') {
      showSlide(current - 1);
    } else if (e.key === 'ArrowRight') {
      showSlide(current + 1);
    }
  });
</script>
