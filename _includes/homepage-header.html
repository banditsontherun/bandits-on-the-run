<header class="nav homepage-nav">
  <!-- Navigation Overlay -->
  <div class="nav-overlay">
    <!-- Left: Navigation Links -->
    <nav class="nav-menu-wrapper nav-left">
      <ul class="nav-menu">
        {% for item in site.data.navigation %}
        <li><a href="{% if item.url contains 'http' %}{{ item.url }}{% else %}{{ item.url | absolute_url }}{% endif %}" class="nav-link">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    
    <!-- Center: Logo -->
    <div class="nav-brand-wrapper">
      <a href="{{ "/" | absolute_url }}" class="nav-brand">
        <img src="{{ "/assets/images/header-logo.webp" | absolute_url }}" alt="{{ site.title }}" class="nav-logo">
      </a>
    </div>
    
    <!-- Right: Social Icons -->
    <div class="nav-social-wrapper">
      <ul class="nav-social">
        {%- include social.html style="header" -%}
      </ul>
    </div>
    
    <!-- Mobile menu toggle -->
    <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
      <span class="nav-toggle-line"></span>
    </button>
  </div>


<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay">
  <!-- Mobile Logo in top-left corner -->
  <div class="mobile-logo-wrapper">
    <img src="{{ "/assets/images/header-logo.webp" | absolute_url }}" alt="{{ site.title }}" class="mobile-logo">
  </div>
  
  <!-- New Mobile X Button -->
  <button class="mobile-x-button" aria-label="Close mobile menu">
    <span class="mobile-x-line"></span>
    <span class="mobile-x-line"></span>
  </button>
  
  <div class="mobile-menu-content">
    <nav class="mobile-nav-menu">
      <ul class="mobile-nav-list">
        {% for item in site.data.navigation %}
        <li><a href="{% if item.url contains 'http' %}{{ item.url }}{% else %}{{ item.url | absolute_url }}{% endif %}" class="mobile-nav-link">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
  
  <!-- Mobile Social Icons - Moved to bottom -->
  <div class="mobile-social-wrapper">
    <ul class="mobile-social">
      {%- include social.html style="header" -%}
    </ul>
  </div>
  </header>
